# Нэг командоор бүхнийг асаана:  docker compose up -d --build
# Дараа нь http://localhost:4000 (эсвэл серверийн домэйн)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: daaluu
      POSTGRES_USER: daaluu
      POSTGRES_PASSWORD: ${DB_PASSWORD:-daaluu_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daaluu -d daaluu"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: daaluu
      PGUSER: daaluu
      PGPASSWORD: ${DB_PASSWORD:-daaluu_change_me}
      # ЗААВАЛ урт санамсаргүй мөр болгоно (.env-д JWT_SECRET=...)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET тохируулна уу}
      # Гаднаас хандах хаяг — QPay callback энд ирнэ (https://play.domain.mn)
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
      # Туршилтын үе: "demo" товчоор зоос авна. Жинхэнэ ашиглалтад false.
      ALLOW_DEMO_PAYMENTS: ${ALLOW_DEMO_PAYMENTS:-true}
      # QPay: sandbox-оор турших бол QPAY_ENABLED=true + TEST_MERCHANT/123456/TEST_INVOICE
      # Гэрээ хийсний дараа QPAY_BASE_URL=https://merchant.qpay.mn + мерчант эрх
      QPAY_ENABLED: ${QPAY_ENABLED:-false}
      QPAY_BASE_URL: ${QPAY_BASE_URL:-https://merchant-sandbox.qpay.mn}
      QPAY_USERNAME: ${QPAY_USERNAME:-}
      QPAY_PASSWORD: ${QPAY_PASSWORD:-}
      QPAY_INVOICE_CODE: ${QPAY_INVOICE_CODE:-}
      QPAY_CALLBACK_SECRET: ${QPAY_CALLBACK_SECRET:-}

volumes:
  pgdata:
